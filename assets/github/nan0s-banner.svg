<style>
text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pulseS{animation:p 3.6s ease-in-out infinite}
.pulseZ{animation:p 3.6s ease-in-out infinite;animation-delay:1.2s}
.pulseC{animation:p 3.6s ease-in-out infinite;animation-delay:2.4s}
.hot{animation:hot 1.8s steps(1) infinite}
.ghost{animation:gl 7s steps(1) infinite}
.blink{animation:bl 1.1s steps(1) infinite}
.bytes{animation:by 6s ease-in-out infinite}
