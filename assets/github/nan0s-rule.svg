<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 28" width="960" height="28" role="presentation">
<defs>
<linearGradient id="r" x1="0" x2="1"><stop offset="0" stop-color="#8f9bff" stop-opacity="0"/><stop offset=".22" stop-color="#8f9bff"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset=".78" stop-color="#39ff14"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></linearGradient>
<linearGradient id="p" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="g" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
<pattern id="t" width="16" height="28" patternUnits="userSpaceOnUse"><rect x="0" y="17" width="1" height="4" fill="#8f9bff" opacity=".35"/></pattern>
<style>
text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.run{animation:run 4.5s linear infinite}
.dot{animation:d 2.2s ease-in-out infinite}
@keyframes run{from{transform:translateX(-160px)}to{transform:translateX(960px)}}
@keyframes d{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</defs>
<rect x="40" y="0" width="880" height="28" fill="url(#t)"/>
<rect x="0" y="14" width="960" height="2" fill="url(#r)" filter="url(#g)" opacity=".7"/>
<rect x="0" y="14" width="960" height="2" fill="url(#r)"/>
<rect class="run" x="0" y="12" width="160" height="6" rx="3" fill="url(#p)" opacity=".9"/>
<rect x="434.0" y="3" width="92" height="22" rx="11" fill="#0b0a1f" stroke="#2a2d55" stroke-width="1"/>
<text x="480.0" y="18" font-size="11" fill="#9aa0d6" text-anchor="middle" letter-spacing="4">7ff8</text>
<rect class="dot" x="418.0" y="11" width="6" height="6" rx="1.5" fill="#ff2bd6" transform="rotate(45 421.0 14)"/>
<rect class="dot" x="536.0" y="11" width="6" height="6" rx="1.5" fill="#39ff14" transform="rotate(45 539.0 14)" style="animation-delay:1.1s"/>
</svg>
