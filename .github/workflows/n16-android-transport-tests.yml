name: NaN16 Android transport tests

on:
  push:
    paths:
      - "aarch64/android/app/src/main/java/org/nan0s/vm/N16HttpsTransport.kt"
      - "aarch64/android/app/src/test/**"
      - "aarch64/android/app/build.gradle.kts"
      - ".github/workflows/n16-android-transport-tests.yml"
  pull_request:
    paths:
      - "aarch64/android/app/src/main/java/org/nan0s/vm/N16HttpsTransport.kt"
      - "aarch64/android/app/src/test/**"
      - "aarch64/android/app/build.gradle.kts"
      - ".github/workflows/n16-android-transport-tests.yml"

permissions:
  contents: read

jobs:
  transport-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
      - name: Run N16 HTTPS transport unit tests and package APK
        run: gradle --no-daemon -p aarch64/android :app:testDebugUnitTest :app:assembleDebug
