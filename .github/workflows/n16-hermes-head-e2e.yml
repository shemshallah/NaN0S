name: NaN16 real Hermes head three-repo parity
on:
  push:
    paths:
      - 'src/nannet/n16_head_worker.nas'
      - 'src/nannet/n16_head_runtime.nas'
      - 'src/nannet/n16_head_store.nas'
      - 'aarch64/android/core/nan16.c'
      - 'aarch64/android/core/nan16.h'
      - 'aarch64/android/core/nan16_int.h'
      - 'tools/nmk.awk'
      - '.github/workflows/n16-hermes-head-e2e.yml'
  pull_request:
    paths:
      - 'src/nannet/n16_head_worker.nas'
      - 'src/nannet/n16_head_runtime.nas'
      - 'src/nannet/n16_head_store.nas'
      - 'aarch64/android/core/nan16.c'
      - 'aarch64/android/core/nan16.h'
      - 'aarch64/android/core/nan16_int.h'
      - 'tools/nmk.awk'
      - '.github/workflows/n16-hermes-head-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-native-guest-to-hermes-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          path: nan0s
      - uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNROUTER
          ref: e46f4294493cdc1bd5b0bfdc0284ff6365d97dde
          path: router
      - uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNLMind_HERMES
          ref: 0594f3f4aae865ced9db0b5d312189a4443d7071
          path: hermes
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build CURRENT NaN0S C transport including class-preserving raw words
        run: |
          cd nan0s/aarch64/android
          cc -std=gnu99 -O2 -fPIC -shared -ffp-contract=off -fno-fast-math \
            core/nan16.c core/nan_dev.c core/nan_load.c \
            core/nan_render.c core/nan_state.c core/nan_net_driver.c \
            -o ../../libnan_head.so -lm
      - name: Assemble CURRENT NaN16 guest worker with exported ABI labels
        run: |
          cd nan0s
          LC_ALL=C awk -f tools/nmk.awk -v CMD=emit \
            -v LABELS="$GITHUB_WORKSPACE/nan0s/head.labels" \
            src/nannet/n16_head_worker.nas > "$GITHUB_WORKSPACE/nan0s/head.nan"
          test -s head.nan
          test -s head.labels
      - name: Execute signed lease, double native revision, durable chart and pack
        working-directory: router
        env:
          PYTHONPATH: ${{ github.workspace }}/router:${{ github.workspace }}/hermes
          HERMES_CHECKPOINT_E2E: '1'
          NAN_HEAD_GUEST_LIBRARY: ${{ github.workspace }}/nan0s/libnan_head.so
          NAN_HEAD_GUEST_IMAGE: ${{ github.workspace }}/nan0s/head.nan
          NAN_HEAD_GUEST_LABELS: ${{ github.workspace }}/nan0s/head.labels
        run: python -m unittest discover -s tests -p 'test_hermes_head_e2e.py' -v
