name: native-nan16-head-runtime
on:
  push:
    paths:
      - 'src/nannet/n16_head_runtime*.nas'
      - 'src/nannet/n16_head_store.nas'
      - 'tools/n16_head_runtime_gate.sh'
      - '.github/workflows/n16-head-runtime.yml'
  pull_request:
    paths:
      - 'src/nannet/n16_head_runtime*.nas'
      - 'src/nannet/n16_head_store.nas'
      - 'tools/n16_head_runtime_gate.sh'
      - '.github/workflows/n16-head-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-head-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute native attach, observe, read and recover
        run: sh tools/n16_head_runtime_gate.sh
