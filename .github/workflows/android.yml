name: android
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    working-directory: aarch64/android
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make seals
      - run: make asan
      - name: NaN toolchain gates (POSIX sh + awk only, no Python)
        working-directory: .
        run: |
          sh tools/ngate_n16i.sh || exit 1
          sh tools/ngate_fuzz.sh || exit 1
          sh tools/ngate_nfix.sh || exit 1
          sh tools/ngate_boot.sh || exit 1
          sh tools/settings_gate.sh || exit 1
          sh tools/ncc_lex.sh || exit 1
          rc=0; sh tools/lanegate.sh || rc=$?; if [ "$rc" -ne 0 ] && [ "$rc" -ne 77 ]; then exit "$rc"; fi
          sh tools/lanesmoke.sh || exit 1
          sh tools/nrun.sh src/tests/carry_probe.nas 2000000 | grep -qx PASS || exit 1
          sh tools/nlink.sh ls >/dev/null || exit 1
          sh tools/mkproof.sh src/tests/key_test.nas || exit 1
          sh tools/nrun.sh src/tests/a2_boot_test.nas | grep -qx 'A2 PASS' || exit 1
          sh crypt/gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
          sh crypt/volume_gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
          sh crypt/storage_decrypt_gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
          sh crypt/storage_boot_gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
          sh crypt/nan0s_fs_gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
          sh crypt/nan0s_fs_meta_gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
          sh crypt/nan0s_fs_dir_gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
          sh crypt/nan0s_fs_cat_gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
          sh crypt/nan0s_fs_sh_gate.sh || { rc=$?; [ "$rc" -eq 77 ] || exit "$rc"; }
  apk:
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.9" }
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nan0s-debug-apk
          path: aarch64/android/app/build/outputs/apk/debug/app-debug.apk
