name: android
on:
  push:
  pull_request:
  workflow_dispatch:
defaults:
  run:
    working-directory: aarch64/android
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make seals
      - run: make asan
      - name: NaN toolchain gates (POSIX sh + awk only, no Python)
        working-directory: .
        run: |
          sh tools/ngate_n16i.sh || exit 1
          sh tools/ngate_fuzz.sh || exit 1
          sh tools/ngate_nfix.sh || exit 1
          sh tools/mkproof.sh src/tests/key_test.nas || exit 1
  apk:
    needs: core-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.9" }
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nan0s-debug-apk
          path: aarch64/android/app/build/outputs/apk/debug/app-debug.apk
